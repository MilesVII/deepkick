[package]
name = "tauri-plugin-deepkick"
version = "0.1.0"
description = "Android bridge for DeepKick Lyrics: SAF file access, foreground service and notifications"
authors = ["milesseventh"]
edition = "2021"
links = "tauri-plugin-deepkick"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
walkdir = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
